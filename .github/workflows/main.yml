name: Build SecureShield VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Auto-fix nested directory if needed
      run: |
        if [ -d "SecureShieldVPN" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "Moving files from nested folder to root..."
          shopt -s dotglob
          mv SecureShieldVPN/* . || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Gradle Wrapper exists
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 8.7
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: SecureShieldVPN-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
